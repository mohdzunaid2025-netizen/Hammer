<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hammer</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:linear-gradient(160deg,#111827,#1f2937,#0f172a);
min-height:100vh;
display:flex;
justify-content:center;
align-items:flex-start;
padding:20px;
color:#fff;
}

.app{
width:100%;
max-width:420px;
background:#0f172a;
border-radius:28px;
padding:22px;
box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

.header{
font-size:24px;
font-weight:700;
margin-bottom:4px;
}

.sub{
font-size:13px;
opacity:0.6;
margin-bottom:24px;
cursor:pointer;
}

.section{
background:#1e293b;
padding:18px;
border-radius:20px;
margin-bottom:18px;
}

.section h3{
font-size:15px;
margin-bottom:10px;
font-weight:600;
}

.guide{
font-size:13px;
line-height:1.7;
opacity:0.8;
}

input[type="file"]{
width:100%;
margin-top:12px;
}

button{
width:100%;
margin-top:14px;
padding:12px;
border:none;
border-radius:14px;
background:#2563eb;
color:white;
font-weight:600;
cursor:pointer;
transition:0.2s;
}

button:active{
transform:scale(0.97);
}

.statusBox{
text-align:center;
font-size:18px;
font-weight:600;
margin-top:6px;
}

.statusDesc{
font-size:13px;
opacity:0.7;
margin-top:4px;
}

.scan{
margin-top:10px;
height:4px;
width:100%;
background:#334155;
border-radius:5px;
overflow:hidden;
}

.scan::after{
content:"";
display:block;
height:100%;
width:40%;
background:#22d3ee;
animation:move 1.2s linear infinite;
}

@keyframes move{
0%{transform:translateX(-100%);}
100%{transform:translateX(250%);}
}

.hidden{
display:none;
}

.admin{
background:#111827;
padding:15px;
border-radius:18px;
margin-top:10px;
}

.admin button{
background:#334155;
margin-top:8px;
}

.footer{
text-align:center;
font-size:12px;
opacity:0.4;
margin-top:12px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">Hammer</div>
<div class="sub" onclick="toggleAdmin()">Supervisor: Zunaid</div>

<div class="section">
<h3>Video Guidelines</h3>
<div class="guide">
✔ Use proper lighting<br>
✔ Keep camera steady<br>
✔ Face fully visible<br>
✔ 5–15 seconds duration
</div>
</div>

<div class="section">
<h3>Upload Verification Video</h3>
<input type="file" id="videoUpload" accept="video/*">
<button onclick="startScan()">Start Verification</button>

<div id="scanBar" class="scan hidden"></div>
</div>

<div class="section">
<h3>Status</h3>
<div id="statusText" class="statusBox">Host pending</div>
<div id="statusDesc" class="statusDesc">Waiting for submission</div>
</div>

<div id="adminPanel" class="admin hidden">
<button onclick="setStatus('pass')">Approve</button>
<button onclick="setStatus('pending')">Set Pending</button>
<button onclick="setStatus('fail')">Reject</button>
</div>

<div class="footer">
Hammer Secure System v5.0
</div>

</div>

<script>
let status="pending";

function startScan(){
const file=document.getElementById("videoUpload").files[0];
if(!file){
alert("Please select a video first.");
return;
}

document.getElementById("scanBar").classList.remove("hidden");
status="pending";
updateStatus();

setTimeout(()=>{
document.getElementById("scanBar").classList.add("hidden");
},3000);
}

function setStatus(newStatus){
status=newStatus;
updateStatus();
}

function updateStatus(){
const text=document.getElementById("statusText");
const desc=document.getElementById("statusDesc");

if(status==="pass"){
text.innerText="Video Approved";
desc.innerText="Video meets required standards.";
}
else if(status==="fail"){
text.innerText="Video Rejected";
desc.innerText="Lighting or clarity insufficient.";
}
else{
text.innerText="Under Review";
desc.innerText="Video under internal review.";
}
}

function toggleAdmin(){
document.getElementById("adminPanel").classList.toggle("hidden");
}

if ("serviceWorker" in navigator) {
navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
