<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hammer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}

body{
background:linear-gradient(160deg,#0f172a,#1e293b);
min-height:100vh;
display:flex;
justify-content:center;
padding:20px;
color:white;
}

.app{
width:100%;
max-width:420px;
background:#111827;
border-radius:28px;
padding:22px;
box-shadow:0 25px 60px rgba(0,0,0,0.6);
}

.header{
font-size:24px;
font-weight:700;
margin-bottom:5px;
}

.sub{
font-size:13px;
opacity:0.6;
margin-bottom:20px;
cursor:pointer;
}

.section{
background:#1f2937;
padding:18px;
border-radius:18px;
margin-bottom:18px;
}

.section h3{
font-size:15px;
margin-bottom:10px;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-weight:600;
cursor:pointer;
}

button:active{transform:scale(0.97);}

.statusText{
font-size:18px;
font-weight:600;
}

.statusDesc{
font-size:13px;
opacity:0.7;
margin-top:5px;
}

.hidden{display:none;}

.admin{
background:#0f172a;
padding:15px;
border-radius:16px;
margin-top:10px;
}

.scan{
height:4px;
width:100%;
background:#334155;
border-radius:5px;
overflow:hidden;
margin-top:8px;
}

.scan::after{
content:"";
display:block;
height:100%;
width:40%;
background:#22d3ee;
animation:move 1.2s linear infinite;
}

@keyframes move{
0%{transform:translateX(-100%);}
100%{transform:translateX(250%);}
}
</style>
</head>

<body>

<div class="app">

<div class="header">Hammer</div>
<div class="sub" onclick="toggleAdmin()">Supervisor: Zunaid</div>

<!-- PHOTO SECTION -->
<div class="section">
<h3>Upload Photo</h3>
<input type="file" id="photoUpload" accept="image/*">
<button onclick="startPhotoReview()">Submit Photo</button>
<div id="photoScan" class="scan hidden"></div>
</div>

<!-- PHOTO STATUS -->
<div class="section">
<h3>Photo Status</h3>
<div id="photoStatus" class="statusText">Pending</div>
<div id="photoDesc" class="statusDesc">Awaiting photo submission</div>
</div>

<!-- VIDEO SECTION -->
<div id="videoSection" class="section hidden">
<h3>Video Guidelines</h3>
<div class="statusDesc">
✔ Proper lighting<br>
✔ Stable camera<br>
✔ Face visible<br>
✔ Duration must be between 5–15 minutes
</div>

<input type="file" id="videoUpload" accept="video/*">
<button onclick="startVideoReview()">Submit Video</button>
<div id="videoScan" class="scan hidden"></div>
</div>

<!-- VIDEO STATUS -->
<div id="videoStatusSection" class="section hidden">
<h3>Video Status</h3>
<div id="videoStatus" class="statusText">Pending</div>
<div id="videoDesc" class="statusDesc">Awaiting video submission</div>
</div>

<!-- ADMIN -->
<div id="adminPanel" class="admin hidden">
<h3>Admin Control</h3>
<button onclick="setPhotoStatus('pass')">Photo Approve</button>
<button onclick="setPhotoStatus('fail')">Photo Reject</button>
<button onclick="setPhotoStatus('pending')">Photo Pending</button>

<br><br>

<button onclick="setVideoStatus('pass')">Video Approve</button>
<button onclick="setVideoStatus('fail')">Video Reject</button>
<button onclick="setVideoStatus('pending')">Video Pending</button>
</div>

</div>

<script>
let photoStatus="pending";
let videoStatus="pending";

/* PHOTO REVIEW */
function startPhotoReview(){
const file=document.getElementById("photoUpload").files[0];
if(!file){alert("Select photo first");return;}

document.getElementById("photoScan").classList.remove("hidden");

setTimeout(()=>{
document.getElementById("photoScan").classList.add("hidden");
photoStatus="pending";
updatePhotoStatus();
},2000);
}

/* VIDEO REVIEW WITH 5–15 MIN VALIDATION */
function startVideoReview(){
const file=document.getElementById("videoUpload").files[0];
if(!file){alert("Select video first");return;}

const video=document.createElement("video");
video.preload="metadata";

video.onloadedmetadata=function(){
window.URL.revokeObjectURL(video.src);
const duration = video.duration / 60; // convert to minutes

if(duration < 5 || duration > 15){
alert("Video must be between 5 and 15 minutes long.");
return;
}

document.getElementById("videoScan").classList.remove("hidden");

setTimeout(()=>{
document.getElementById("videoScan").classList.add("hidden");
videoStatus="pending";
updateVideoStatus();
},2000);
};

video.src = URL.createObjectURL(file);
}

/* ADMIN CONTROL */
function setPhotoStatus(status){
photoStatus=status;
updatePhotoStatus();
}

function setVideoStatus(status){
videoStatus=status;
updateVideoStatus();
}

/* UPDATE UI */
function updatePhotoStatus(){
const text=document.getElementById("photoStatus");
const desc=document.getElementById("photoDesc");

if(photoStatus==="pass"){
text.innerText="Photo Approved";
desc.innerText="Photo meets standards.";
document.getElementById("videoSection").classList.remove("hidden");
document.getElementById("videoStatusSection").classList.remove("hidden");
}
else if(photoStatus==="fail"){
text.innerText="Photo Rejected";
desc.innerText="Photo quality insufficient.";
document.getElementById("videoSection").classList.add("hidden");
document.getElementById("videoStatusSection").classList.add("hidden");
}
else{
text.innerText="Photo Pending";
desc.innerText="Photo under review.";
}
}

function updateVideoStatus(){
const text=document.getElementById("videoStatus");
const desc=document.getElementById("videoDesc");

if(videoStatus==="pass"){
text.innerText="Video Approved";
desc.innerText="Video verified successfully.";
}
else if(videoStatus==="fail"){
text.innerText="Video Rejected";
desc.innerText="Lighting or clarity insufficient.";
}
else{
text.innerText="Video Pending";
desc.innerText="Video under review.";
}
}

function toggleAdmin(){
document.getElementById("adminPanel").classList.toggle("hidden");
}
</script>

</body>
</html>
