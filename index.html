<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hammer</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2027">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(160deg,#0f2027,#203a43,#2c5364);
color:white;
display:flex;
justify-content:center;
min-height:100vh;
overflow-x:hidden;
}

.app{
width:100%;
max-width:420px;
padding:20px;
padding-bottom:100px;
}

.topbar{
display:flex;
align-items:center;
gap:15px;
margin-bottom:30px;
}

.logo{
font-size:32px;
cursor:pointer;
}

.title{
font-size:22px;
font-weight:700;
}

.subtitle{
font-size:12px;
opacity:0.7;
cursor:pointer;
}

.glass{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(18px);
border-radius:22px;
padding:22px;
margin-bottom:20px;
box-shadow:0 15px 50px rgba(0,0,0,0.5);
transition:0.3s;
}

.glass:hover{
transform:translateY(-5px);
}

button{
width:100%;
padding:14px;
border:none;
border-radius:15px;
margin-top:12px;
background:linear-gradient(45deg,#00c6ff,#0072ff);
color:white;
font-weight:600;
font-size:15px;
transition:0.2s;
}

button:active{
transform:scale(0.95);
}

.status-box{
text-align:center;
}

.status-text{
font-size:20px;
margin-top:10px;
font-weight:600;
}

.pending{color:#ffc107;}
.pass{color:#00ff95;}
.fail{color:#ff4d4d;}

.hidden{
display:none;
}

.admin-panel{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0f2027;
padding:25px;
z-index:99;
overflow:auto;
}

.admin-panel h2{
margin-bottom:20px;
}

.bottom-nav{
position:fixed;
bottom:0;
width:100%;
max-width:420px;
background:#0f2027;
padding:15px;
display:flex;
justify-content:space-around;
border-top:1px solid #222;
}
</style>
</head>

<body>

<div class="app">

<div class="topbar">
<div class="logo" onclick="secretTap()">🔨</div>
<div>
<div class="title">Hammer</div>
<div class="subtitle" onclick="secretTap()">Supervisor: Zunaid</div>
</div>
</div>

<div class="glass">
<h3>Initial Visual Screening</h3>
<p style="opacity:0.7;margin-top:8px;">Upload clear image for evaluation.</p>

<input type="file" id="imageUpload" style="display:none">
<button onclick="document.getElementById('imageUpload').click()">Select Image</button>
<button onclick="handleUpload()">Submit</button>
</div>

<div class="glass status-box">
<h3>Assessment Status</h3>
<div id="statusText" class="status-text pending">Host pending</div>
<p id="statusDesc" style="opacity:0.7;margin-top:8px;">
Your submission is under internal review.
</p>
</div>

<div id="videoSection" class="glass hidden">
<h3>Upload Video & Earn Work As Us</h3>
<input type="file" id="videoUpload" style="display:none">
<button onclick="document.getElementById('videoUpload').click()">Select Video</button>
<button onclick="alert('Video submitted successfully')">Submit Video</button>
</div>

</div>

<div class="bottom-nav">
<span>🏠</span>
<span>📤</span>
<span>⚙</span>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="admin-panel hidden">
<h2>Admin Control Panel</h2>

<button onclick="setStatus('pass')">PASS</button>
<button onclick="setStatus('fail')">FAIL</button>
<button onclick="setStatus('pending')">PENDING</button>

<br><br>
<button onclick="toggleAdmin()">Close Panel</button>
</div>

<script>

let status="pending";
let tapCount=0;

function handleUpload(){
const file=document.getElementById("imageUpload").files[0];
if(!file){
alert("Please select image first.");
return;
}
alert("Image uploaded successfully.");
status="pending";
updateStatus();
}

function setStatus(newStatus){
status=newStatus;
updateStatus();
}

function updateStatus(){
const text=document.getElementById("statusText");
const desc=document.getElementById("statusDesc");
const video=document.getElementById("videoSection");

text.classList.remove("pending","pass","fail");

if(status==="pass"){
text.innerText="Host healthy, host good";
desc.innerText="Visual indicators meet expected baseline.";
text.classList.add("pass");
video.classList.remove("hidden");
}
else if(status==="fail"){
text.innerText="Host immature";
desc.innerText="Visual indicators below baseline.";
text.classList.add("fail");
video.classList.add("hidden");
}
else{
text.innerText="Host pending";
desc.innerText="Your submission is under internal review.";
text.classList.add("pending");
video.classList.add("hidden");
}
}

function secretTap(){
tapCount++;
if(tapCount>=5){
toggleAdmin();
tapCount=0;
}
}

function toggleAdmin(){
document.getElementById("adminPanel").classList.toggle("hidden");
}

</script>

<script>
if ("serviceWorker" in navigator) {
navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
